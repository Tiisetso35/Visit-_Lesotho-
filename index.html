<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=device-width, initial-scale=1.0">
    <title>Lesotho Hub - Your Gateway to Local Businesses</title>
    <meta name="description" content="Discover local businesses in Lesotho, explore categories, and connect with entrepreneurs.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to Lesotho Hub</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="business.html">Businesses</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="tips.html">Tips</a></li>
                <li style="float:right;"><button id="loginBtn" class="login-button">Login / Create Account</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Business Categories</h2>
            <div class="button-container">
                <a href="business.html?category=farmers" class="category-button">Farmers</a>
                <a href="business.html?category=crafts" class="category-button">Crafts</a>
                <a href="business.html?category=retail" class="category-button">Retail</a>
            </div>
        </section>

        <section>
            <h2>Featured Businesses</h2>
            <div class="featured-businesses">
                <div class="business">
                    <img src="image2.jfif" alt="Local Farmer's Market">
                    <a href="business.html?category=farmers" class="button">View More</a>
                </div>
                <div class="business">
                    <img src="image7.jpg" alt="Handcrafted Goods from Local Artisans">
                    <a href="business.html?category=crafts" class="button">View More</a>
                </div>
                <div class="business">
                    <img src="image5.jpg" alt="Local Retail Shop">
                    <a href="business.html?category=retail" class="button">View More</a>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Login or Create Account</h2>
            <form id="loginForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <br>
                <button type="submit">Login</button>
                <p>Don't have an account? <a href="#">Create one</a></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
